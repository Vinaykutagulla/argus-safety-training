version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: argus-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongodb_data:/data/db
    networks:
      - argus-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: argus-backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/argus-pv?authSource=admin
      PORT: 5000
      JWT_SECRET: your-super-secret-jwt-key
      NODE_ENV: development
    depends_on:
      - mongodb
    networks:
      - argus-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: argus-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - argus-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongodb_data:

networks:
  argus-network:
    driver: bridge
